<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 8" width="100%" height="8" fill="none">
  <defs>
    <linearGradient id="calm-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="15%" stop-color="#00f2fe" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.75" />
      <stop offset="85%" stop-color="#00f2fe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>
    <style>
      .glow-line {
        animation: calm-pulse 5s ease-in-out infinite alternate;
      }
      @keyframes calm-pulse {
        0% { opacity: 0.3; }
        50% { opacity: 0.75; }
        100% { opacity: 0.3; }
      }
    </style>
  </defs>
  <line class="glow-line" x1="30" y1="4" x2="970" y2="4" stroke="url(#calm-line)" stroke-width="1.5" stroke-linecap="round" />
  <circle class="glow-line" cx="500" cy="4" r="2" fill="#00f2fe" />
</svg>
